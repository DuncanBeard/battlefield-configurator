# =============================================================================
# [GstKeyBinding] - All keybinds across default, helicopter, infantry contexts
# =============================================================================
# Format: <context>.<ActionName>.<slotIndex>.<field> = value
#   context: default | helicopter | infantry
#   slot: 0=primary, 1+=alternates
#   field: type (0=Mouse, 1=Gamepad, 2=Keyboard/DIK, 3=Joystick, -1=Disabled)
#          button (device-specific scancode; 255+type=2 means unbound)
#          axis (analog axis index; 0 for digital)
#          negate (0/1 - invert axis direction)
#
# 973 keys. Do not hand-edit unless you know DIK scancodes.
# Rebind in-game, then use import.js to detect changes.
# =============================================================================
