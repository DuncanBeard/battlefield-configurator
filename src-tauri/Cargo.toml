[package]
name = "bf6-configurator"
version = "0.2.0"
description = "Battlefield 6 settings configurator"
authors = ["Duncan"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "bf6_configurator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
